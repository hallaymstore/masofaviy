name: SFU Selftest
on:
  push:
    paths:
      - 'sfu/**'
      - '.github/workflows/sfu-selftest.yml'
  workflow_dispatch:
jobs:
  test-sfu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sfu/package-lock.json
      - name: Install SFU dependencies
        working-directory: sfu
        run: npm install
      - name: Run SFU selftest
        working-directory: sfu
        run: npm test
