name: SFU Selftest
on:
  push:
    paths:
      - 'sfu/**'
      - '.github/workflows/sfu-selftest.yml'
  workflow_dispatch:
jobs:
  test-sfu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SFU dependencies
        working-directory: sfu
        run: npm install
      - name: Run SFU signalling selftest
        working-directory: sfu
        run: npm test
      - name: Install Chromium
        working-directory: sfu
        run: npx playwright install --with-deps chromium
      - name: Run teacher to student browser video E2E
        working-directory: sfu
        run: npm run test:e2e
